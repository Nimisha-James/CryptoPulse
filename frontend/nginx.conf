server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://dashboard-api:8001/;
    }

    location /agent/ {
        proxy_pass http://agent-service:8000/;
    }
}
